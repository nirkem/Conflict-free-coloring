<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Points with Circle Drawing</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
    }

    .top-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      align-items: center;
    }

    .canvas-wrapper {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }

    .bottom-controls {
      margin-top: 20px;
    }

    .circle-result {
      display: flex;
      flex-direction: column;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .circle-result label {
      text-align: center;
      margin-bottom: 4px;
      white-space: pre-line;
    }

    .circle-result input {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #aaa;
      width: 220px;
      text-align: center;
    }

    .faded {
      opacity: 0.4;
      pointer-events: none;
    }

    input[type="number"] {
      width: 120px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background-color: #2e86de;
      color: white;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #1e5bb8;
    }

    canvas {
      border: 2px solid #ccc;
      border-radius: 8px;
      background-color: white;
    }
  </style>
</head>
<body>
  <div class="top-controls">
    <input type="number" id="pointCount" min="1" placeholder="Number of points" />
    <button onclick="handleDraw()">Draw Points</button>
  </div>

  <div class="canvas-wrapper">
    <canvas id="canvas" width="500" height="500"></canvas>

    <div class="right-panel">
      <div id="circleResult" class="circle-result faded">
        <label for="circleOutput">Conflict-free color<br>in the circle:</label>
        <input type="text" id="circleOutput" readonly value="" />
      </div>
      <button id="drawCircleButton" onclick="toggleCircleMode()">Draw Circle (Off)</button>
    </div>
  </div>

  <div class="bottom-controls">
    <button onclick="generateConflictFreeColoring()">Generate conflict-free coloring</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let points = [];
    let isCircleMode = false;
    let circle = null;
    let isMouseDown = false;
    let circleStart = null;

    function drawGrid(spacing = 25) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      for (let x = spacing; x < canvas.width; x += spacing) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      for (let y = spacing; y < canvas.height; y += spacing) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function drawRandomPoints(n) {
      points = [];
      for (let i = 0; i < n; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        points.push({ x, y });
        drawPoint(x, y);
      }
    }

    function drawPoint(x, y, color = '#000000') {
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }

    function handleDraw() {
      const count = parseInt(document.getElementById('pointCount').value);
      if (!isNaN(count) && count > 0) {
        drawGrid();
        drawRandomPoints(count);
      } else {
        alert('Please enter a valid positive number.');
      }
    }

    function generateConflictFreeColoring() {
      const n = points.length;
      const data = {
        points: points.map(p => ({
          x: +(p.x / canvas.width).toFixed(3),
          y: +(p.y / canvas.height).toFixed(3),
          color: 0
        }))
      };

      // Simulate server assigning random colors from 1 to n
      const assignedColors = data.points.map(p => ({
        ...p,
        color: Math.floor(Math.random() * n) + 1
      }));

      const colorPalette = [
        "#e6194b", "#3cb44b", "#ffe119", "#4363d8", "#f58231", "#911eb4", "#46f0f0",
        "#f032e6", "#bcf60c", "#fabebe", "#008080", "#e6beff", "#9a6324", "#fffac8",
        "#800000", "#aaffc3", "#808000", "#ffd8b1", "#000075", "#808080"
      ];

      drawGrid();
      assignedColors.forEach(p => {
        const colorIndex = (p.color - 1) % colorPalette.length;
        drawPoint(p.x * canvas.width, p.y * canvas.height, colorPalette[colorIndex]);
      });

      console.log("Simulated server response with colors:", assignedColors);
    }


    function toggleCircleMode() {
      isCircleMode = !isCircleMode;
      const button = document.getElementById('drawCircleButton');
      const resultBox = document.getElementById('circleResult');
      button.innerText = `Draw Circle (${isCircleMode ? 'On' : 'Off'})`;
      resultBox.classList.toggle('faded', !isCircleMode);

      if (!isCircleMode) {
        drawGrid();
        points.forEach(p => drawPoint(p.x, p.y));
      }
    }

    function drawCirclePreview(center, radius) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      points.forEach(p => drawPoint(p.x, p.y));

      if (center && radius) {
        ctx.beginPath();
        ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 87, 51, 0.2)';
        ctx.strokeStyle = '#FF5733';
        ctx.lineWidth = 2;
        ctx.fill();
        ctx.stroke();
      }
    }

    canvas.addEventListener('mousedown', (event) => {
      if (!isCircleMode) return;
      isMouseDown = true;
      const rect = canvas.getBoundingClientRect();
      circleStart = {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
      circle = { center: { ...circleStart }, radius: 0 };
    });

    canvas.addEventListener('mousemove', (event) => {
      if (!isMouseDown || !isCircleMode || !circleStart) return;
      const rect = canvas.getBoundingClientRect();
      const mouseX = event.clientX - rect.left;
      const mouseY = event.clientY - rect.top;

      const dx = mouseX - circleStart.x;
      const dy = mouseY - circleStart.y;
      circle.radius = Math.sqrt(dx * dx + dy * dy);

      drawCirclePreview(circle.center, circle.radius);
    });

    canvas.addEventListener('mouseup', () => {
      if (!isMouseDown || !isCircleMode || !circleStart) return;
      isMouseDown = false;

      const circleData = {
        circle: {
          center: {
            x: (circle.center.x / canvas.width).toFixed(3),
            y: (circle.center.y / canvas.height).toFixed(3)
          },
          radius: (circle.radius / canvas.width).toFixed(3)
        }
      };
      console.log('Generated circle.json:', JSON.stringify(circleData, null, 2));

      ctx.beginPath();
      ctx.arc(circle.center.x, circle.center.y, circle.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 87, 51, 0.2)';
      ctx.strokeStyle = '#FF5733';
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();
    });

    drawGrid();

    document.getElementById('pointCount').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        handleDraw();
      }
    });

  </script>
</body>
</html>
