<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Random Points with Circle Drawing</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<header>
			<h1>Conflict-Free Coloring</h1>
		</header>
		<div class="container">
			<!-- Left side: Canvas -->
			<div class="left-panel">
				<canvas id="canvas" width="600" height="600"></canvas>
			</div>

			<!-- Right side: Controls -->
			<div class="right-panel">
				<!-- Top: Choose number of points -->
				<div class="top-controls">
					<div class="input-row">
						<h2>Insert Number of Points:</h2>
						<input
							type="number"
							id="pointCount"
							min="1"
							placeholder="1, 2, 3, ..."
						/>
					</div>
					<button onclick="handleDraw()">Draw Points</button>
				</div>

				<!-- JSON Viewer -->
				<div id="jsonViewer" class="json-viewer">
					<table>
						<thead>
							<tr>
								<th>#</th>
								<th>X</th>
								<th>Y</th>
								<th>Color</th>
							</tr>
						</thead>
						<tbody id="pointsTableBody">
							<!-- Points will be dynamically added here -->
						</tbody>
					</table>
				</div>

				<!-- Generate conflict-free coloring -->
				<div class="bottom-controls">
					<button
						id="generateColoringButton"
						onclick="handleColoring()"
						disabled
					>
						Generate conflict-free coloring
					</button>
					<div class="color-count">
						<label for="colorCountOutput">Number of Colors:</label>
						<output id="colorCountOutput">0</output>
					</div>
				</div>

				<!-- Circle Output and Button -->
				<div class="circle-controls">
					<button id="drawCircleButton" onclick="toggleCircleMode()" disabled>
						Draw Circle (Off)
					</button>
					<div class="color-count">
						<label for="uniqueColorOutput">Unique color inside circle:</label>
						<output id="uniqueColorOutput">N/A</output>
					</div>
				</div>
			</div>
		</div>
		<script src="https://unpkg.com/delaunator@5.0.0/delaunator.min.js"></script>
		<script src="script.js"></script>
	</body>
</html>
