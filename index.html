<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Points with Circle Drawing</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
    }

    .top-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      align-items: center;
    }

    .canvas-wrapper {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }

    .bottom-controls {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .circle-result {
      display: flex;
      flex-direction: column;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .circle-result label {
      text-align: center;
      margin-bottom: 4px;
      white-space: pre-line;
    }

    .circle-result input {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #aaa;
      width: 220px;
      text-align: center;
    }

    .faded {
      opacity: 0.4;
      pointer-events: none;
    }

    input[type="number"] {
      width: 120px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background-color: #2e86de;
      color: white;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #1e5bb8;
    }

    canvas {
      border: 2px solid #ccc;
      border-radius: 8px;
      background-color: white;
    }

    #jsonViewer {
      margin-top: 15px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      width: 400px;
      height: 200px;
      overflow-y: auto;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="top-controls">
    <input type="number" id="pointCount" min="1" placeholder="Number of points" />
    <button onclick="handleDraw()">Draw Points</button>
  </div>

  <div class="canvas-wrapper">
    <canvas id="canvas" width="500" height="500"></canvas>

    <div class="right-panel">
      <div id="circleResult" class="circle-result faded">
        <label for="circleOutput">CF color<br>in the circle:</label>
        <input type="text" id="circleOutput" readonly value="" />
      </div>
      <button id="drawCircleButton" onclick="toggleCircleMode()">Draw Circle (Off)</button>
    </div>
  </div>

  <div class="bottom-controls">
    <button onclick="handleColoring()">Generate conflict-free coloring</button>
    <div id="jsonViewer"></div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let points = [];
    let isCircleMode = false;
    let circle = null;
    let isMouseDown = false;
    let circleStart = null;

    function drawGrid(spacing = 25) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      for (let x = spacing; x < canvas.width; x += spacing) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      for (let y = spacing; y < canvas.height; y += spacing) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function drawRandomPoints(n) { //assign value to points
      points = [];
      for (let i = 0; i < n; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        points.push({ x, y, color: 0 });
        drawPoint(x, y);
      }
      updateJsonViewer();
    }

    function drawPoint(x, y, color = '#000000') {
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }

    function handleDraw() {
      const count = parseInt(document.getElementById('pointCount').value);
      if (!isNaN(count) && count > 0) {
        drawGrid();
        drawRandomPoints(count);
      } else {
        alert('Please enter a valid positive number.');
      }
    }

    async function handleColoring() {
      try {
        console.log("Sending points to backend:", points);
        const coloredPoints = await generateConflictFreeColoring(points);

        drawGrid();
        coloredPoints.forEach((p, i) => {
          points[i].color = p.color;
          const colorIndex = (p.color - 1) % 100;
          drawPoint(points[i].x, points[i].y, colorFromPalette(colorIndex));
        });

        updateJsonViewer();
        console.log("Assigned colors:", points);
      } catch (err) {
        console.error('Error from backend:', err);
        alert('Failed to generate coloring from server.');
      }
    }


    function updateJsonViewer() {
      const viewer = document.getElementById('jsonViewer');
      const displayPoints = points.map(p => ({
        x: +(p.x / canvas.width).toFixed(3),
        y: +(p.y / canvas.height).toFixed(3),
        color: p.color
      }));
      viewer.textContent = JSON.stringify({ points: displayPoints }, null, 2);
    }

    function toggleCircleMode() {
      isCircleMode = !isCircleMode;
      const button = document.getElementById('drawCircleButton');
      const resultBox = document.getElementById('circleResult');
      button.innerText = `Draw Circle (${isCircleMode ? 'On' : 'Off'})`;
      resultBox.classList.toggle('faded', !isCircleMode);

      if (!isCircleMode) {
        drawGrid();
        points.forEach(p => drawPoint(p.x, p.y));
      }
    }

    function drawCirclePreview(center, radius) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      points.forEach(p => {
        const color = p.color === 0 ? '#000000' : colorFromPalette(p.color);
        drawPoint(p.x, p.y, color);
      });

      if (center && radius) {
        ctx.beginPath();
        ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 87, 51, 0.2)';
        ctx.strokeStyle = '#FF5733';
        ctx.lineWidth = 2;
        ctx.fill();
        ctx.stroke();
      }
    }

    function colorFromPalette(colorNumber) {
      const colorPalette = [
        "#e6194b","#3cb44b","#ffe119","#4363d8","#f58231","#911eb4","#46f0f0","#f032e6","#bcf60c","#fabebe",
        "#008080","#e6beff","#9a6324","#fffac8","#800000","#aaffc3","#808000","#ffd8b1","#000075","#808080",
        "#a9a9a9","#b0e0e6","#ff69b4","#cd5c5c","#ff7f50","#7fffd4","#6495ed","#ffb6c1","#dda0dd","#f0e68c",
        "#90ee90","#20b2aa","#ff6347","#00fa9a","#f5deb3","#d2691e","#ff1493","#adff2f","#9932cc","#7cfc00",
        "#ff4500","#00ced1","#1e90ff","#db7093","#ff8c00","#4682b4","#da70d6","#eee8aa","#8a2be2","#00ff7f",
        "#dc143c","#7b68ee","#00ffff","#32cd32","#8b0000","#00bfff","#ff00ff","#d2b48c","#8fbc8f","#a0522d",
        "#ffdead","#5f9ea0","#b22222","#228b22","#0000cd","#bdb76b","#deb887","#ff69b4","#b0c4de","#7fffd4",
        "#cd853f","#6a5acd","#ffdab9","#bc8f8f","#98fb98","#4169e1","#f4a460","#2e8b57","#ffefd5","#d8bfd8",
        "#00ff00","#dda0dd","#800080","#48d1cc","#c71585","#f0fff0","#f0ffff","#f5f5dc","#ffe4e1","#f5f5f5",
        "#fa8072","#ffebcd","#b8860b","#556b2f","#9932cc","#8b008b","#708090","#6b8e23","#ff4500","#2f4f4f"
      ];
      return palette[(colorNumber - 1) % palette.length];
    }

    canvas.addEventListener('mousedown', (event) => {
      if (!isCircleMode) return;
      isMouseDown = true;
      const rect = canvas.getBoundingClientRect();
      circleStart = {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
      circle = { center: { ...circleStart }, radius: 0 };
    });

    canvas.addEventListener('mousemove', (event) => {
      if (!isMouseDown || !isCircleMode || !circleStart) return;
      const rect = canvas.getBoundingClientRect();
      const mouseX = event.clientX - rect.left;
      const mouseY = event.clientY - rect.top;

      const dx = mouseX - circleStart.x;
      const dy = mouseY - circleStart.y;
      circle.radius = Math.sqrt(dx * dx + dy * dy);

      drawCirclePreview(circle.center, circle.radius);
    });

    canvas.addEventListener('mouseup', () => {
      if (!isMouseDown || !isCircleMode || !circleStart) return;
      isMouseDown = false;

      const circleData = {
        circle: {
          center: {
            x: (circle.center.x / canvas.width).toFixed(3),
            y: (circle.center.y / canvas.height).toFixed(3)
          },
          radius: (circle.radius / canvas.width).toFixed(3)
        }
      };
      console.log('Generated circle.json:', JSON.stringify(circleData, null, 2));

      ctx.beginPath();
      ctx.arc(circle.center.x, circle.center.y, circle.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 87, 51, 0.2)';
      ctx.strokeStyle = '#FF5733';
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();
    });

    drawGrid();

    document.getElementById('pointCount').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        handleDraw();
      }
    });
  </script>
  <script type="module">
    import { generateConflictFreeColoring } from './App.js';
    window.generateConflictFreeColoring = generateConflictFreeColoring;
  </script>
</body>
</html>
